name: Rowian Tracker web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "fitness-app/**"
      - ".github/workflows/fitness-app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fitness-app-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fitness-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fitness-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
